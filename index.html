<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đức Thành — Tra giá &amp; tính đơn</title>
<!-- KẾT NỐI PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E7A46">
<meta name="app-version" content="2026.09.26.3">
<link rel="apple-touch-icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F8F5; --card:#FFFFFF; --ink:#16231C; --muted:#5C6B60; --line:#DCE3DA;
    --green:#1E7A46; --green-dark:#155C34; --green-soft:#E7F1EA;
    --ochre:#B9591A; --ochre-soft:#FBEDE0; --danger:#B23B2E;
    --shadow:0 2px 10px rgba(20,40,28,.08);
    --mode:var(--green); --mode-soft:var(--green-soft);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{max-width:640px;margin:0 auto;padding-bottom:120px;line-height:1.35}
  body[data-che-do="no"]{ --mode:var(--ochre); --mode-soft:var(--ochre-soft); }

  header{position:sticky;top:0;z-index:30;background:var(--paper);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:22px;letter-spacing:-.3px}
  .brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .toggle{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
  .toggle button{font-family:inherit;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;padding:9px 14px;border-radius:999px;cursor:pointer}
  .toggle button.on{color:#fff;background:var(--mode)}
  .search-wrap{position:relative;margin-top:10px}
  #q{width:100%;font-family:inherit;font-size:20px;font-weight:600;padding:16px 46px 16px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  #q:focus{outline:none;border-color:var(--mode)}
  #q::placeholder{color:var(--muted);font-weight:500}
  .clear-q{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:none}
  .clear-q.show{display:block}
  .statusbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
  .refresh{border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .refresh:active{transform:scale(.96)}

  main{padding:6px 12px 0}
  .group-h{font-size:13px;font-weight:700;color:var(--muted);padding:16px 6px 6px}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .row .info{flex:1;min-width:0}
  .name{font-size:19px;font-weight:700;line-height:1.25}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
  .badge{font-size:13px;font-weight:700;color:var(--green-dark);background:var(--green-soft);padding:2px 8px;border-radius:6px}
  body[data-che-do="no"] .badge{color:var(--ochre);background:var(--ochre-soft)}
  .unit{font-size:13px;color:var(--muted)}
  .price{font-size:20px;font-weight:800;margin-top:6px}
  .price .cur{font-size:14px;font-weight:600;color:var(--muted)}
  .add-col{display:flex;flex-direction:column;align-items:center;gap:2px}
  .add{border:0;background:var(--mode);color:#fff;font-family:inherit;font-weight:800;font-size:26px;width:52px;height:52px;border-radius:14px;cursor:pointer;line-height:1}
  .add:active{transform:scale(.94)}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{border:2px solid var(--mode);background:var(--card);color:var(--mode);font-family:inherit;font-weight:800;font-size:22px;width:44px;height:44px;border-radius:12px;cursor:pointer;line-height:1}
  .stepper .qty{min-width:34px;text-align:center;font-size:22px;font-weight:800}
  .empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:16px}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:640px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(20,40,28,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar-in{display:flex;align-items:center;gap:12px}
  .bar-tot{flex:1}
  .bar-tot .lbl{font-size:13px;color:var(--muted);font-weight:600}
  .bar-tot .sum{font-size:30px;font-weight:800;line-height:1.05}
  .bar-tot .sum .cur{font-size:15px;color:var(--muted)}
  .btn-view{border:0;background:var(--mode);color:#fff;font-family:inherit;font-weight:800;font-size:17px;padding:15px 20px;border-radius:14px;cursor:pointer}
  .btn-view:disabled{opacity:.4}
  .cnt{background:#fff;color:var(--mode);border-radius:999px;font-size:13px;font-weight:800;padding:1px 8px;margin-left:6px}

  .scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:50;display:none}
  .scrim.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:640px;margin:0 auto;background:var(--paper);border-radius:20px 20px 0 0;transform:translateY(100%);visibility:hidden;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column}
  .sheet.open{transform:translateY(0);visibility:visible}
  .sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 8px;flex:none}
  .sheet-hd h2{flex:1}
  .jump-pay,.new-order{font-family:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--mode);border-radius:10px;padding:10px;cursor:pointer;min-height:42px}
  .new-order{margin-top:6px;padding:4px 10px;min-height:32px}
  body.order-open{overflow:hidden}
  .customer-info{margin:4px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px}
  .customer-info summary{font-weight:700;font-size:14px;cursor:pointer;padding:3px 0}
  .customer-info .don-info{margin-top:12px}
  .sheet-hd h2{font-size:20px;font-weight:800}
  .sheet-hd .x{border:0;background:var(--line);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
  .sheet-scroll{overflow:auto;min-height:0;flex:1;padding:4px 12px 16px;overscroll-behavior:contain}
  .don-info{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
  .don-info label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
  .don-info input{font-family:inherit;font-size:18px;font-weight:600;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-width:0}
  .don-info input:focus{outline:none;border-color:var(--mode)}
  .line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .line-top{display:flex;justify-content:space-between;gap:10px}
  .line-name{font-size:17px;font-weight:700}
  .line-sub{font-size:13px;color:var(--muted);margin-top:2px}
  .line-bot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .line-total{font-size:19px;font-weight:800}
  .del{border:0;background:transparent;color:var(--danger);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:6px}
  .sheet-foot{border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);flex:none}
  .sheet-summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
  .grand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .grand .lbl{font-size:16px;font-weight:700}
  .grand .val{font-size:34px;font-weight:800}
  .grand .val .cur{font-size:16px;color:var(--muted)}
  .pay-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
  .pay-row label{font-size:16px;font-weight:700}
  .pay-row .money{position:relative}
  .pay-row input{font-family:inherit;font-size:20px;font-weight:800;text-align:right;width:170px;padding:11px 30px 11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  .pay-row input:focus{outline:none;border-color:var(--mode)}
  .pay-row .money::after{content:'đ';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;font-size:14px}
  .grand.remain .val{color:var(--ochre)}
  .grand.remain.done .val{color:var(--green);font-size:22px}
  
  /* CẬP NHẬT GIAO DIỆN NÚT BẤM */
  .foot-btns{display:grid; grid-template-columns: 1fr 1fr; gap:10px}
  .foot-btns button{font-family:inherit;font-weight:800;font-size:14px;padding:10px 6px;border-radius:12px;cursor:pointer;border:0;min-height:42px}
  .b-clear{background:var(--card);border:2px solid var(--line)!important;color:var(--muted)}
  .b-send{background:var(--card);border:2px solid var(--mode)!important;color:var(--mode)}
  .b-pdf{background:var(--ochre);color:#fff}
  .b-copy{background:var(--mode);color:#fff}
  
  .payfull{border:1.5px solid var(--mode);background:var(--card);color:var(--mode);font-family:inherit;font-weight:800;font-size:13px;padding:11px 12px;border-radius:11px;cursor:pointer;white-space:nowrap}
  .pay-row .grp{display:flex;gap:8px;align-items:center}
  .grand.sub{margin-bottom:8px}
  .grand.sub .lbl{font-size:15px;font-weight:700}
  .grand.sub .val{font-size:24px;font-weight:800}
  .filters{display:flex;gap:8px;margin-top:10px}
  .chip{flex:1;font-family:inherit;border:2px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:14px;padding:10px 6px;border-radius:12px;cursor:pointer;text-align:center}
  .chip.on{border-color:var(--mode);color:#fff;background:var(--mode)}
  .qtyin{width:52px;text-align:center;font-family:inherit;font-size:20px;font-weight:800;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 2px;background:var(--card)}
  .qtyin:focus{outline:none;border-color:var(--mode)}
  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .resume-dialog{border:0;border-radius:18px;margin:auto;width:calc(100% - 32px);max-width:380px;padding:22px;color:var(--ink);background:var(--card);font-family:inherit;box-shadow:var(--shadow)}
  .resume-dialog::backdrop{background:rgba(10,20,14,.55)}
  .resume-dialog h2{font-size:20px;margin-bottom:10px}
  .resume-dialog p{font-size:14px;line-height:1.6;margin-bottom:16px}
  .resume-dialog button{display:block;width:100%;min-height:46px;margin-top:10px;border-radius:12px;border:1px solid var(--line);font:inherit;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink)}
  .resume-dialog .start-new{background:var(--mode);color:white;border-color:var(--mode)}
  .line-name,.name{overflow-wrap:anywhere;min-width:0}
  .line-top>div{min-width:0}
  .line-bot{gap:8px;flex-wrap:wrap}
  .grand{gap:8px;flex-wrap:wrap}
  .pay-row .grp{min-width:0}
  @media screen and (max-width:600px){
    .sheet{height:calc(100vh - 8px);height:calc(100dvh - max(8px, env(safe-area-inset-top)));max-height:none}
    .sheet-hd{padding:8px 12px}
    .sheet-hd h2{font-size:18px}
    .sheet-scroll{padding-top:0}
    .sheet-summary .grand .val{font-size:26px}
    .pay-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px);gap:6px}
    .pay-row label{font-size:14px}
    .pay-row .money{display:block;min-width:0}
    .pay-row input{width:100%;min-width:0;font-size:17px;padding:10px 25px 10px 6px}
    .pay-row .grp{gap:5px}
    .pay-row .grp .money{flex:1}
    .payfull{padding:10px 6px;font-size:12px;flex:none}
    .foot-btns{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
    .foot-btns button{font-size:12px;min-height:44px;padding:8px 2px}
    .brand{font-size:19px}
    .toggle button{padding:9px 10px;font-size:14px}
    .bar{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
    .bar-tot .sum{font-size:25px}
    .btn-view{padding:13px 12px;font-size:15px}
    .row{gap:8px;padding:10px}
    .row .name{font-size:17px}
    .row .stepper{gap:3px}
    .row .stepper button{width:36px;height:42px}
    .row .qtyin{width:42px;font-size:18px}
  }
  /* =========================================================
     IN HÓA ĐƠN A5 - NATIVE PRINT
     ========================================================= */

  #printInvoice{display:none}

  @page{
    size:A5 portrait;
    margin:8mm;
  }

  @media print{
    html,body{
      overflow:visible !important;
      height:auto !important;
      width:148mm !important;
      min-width:148mm !important;
      max-width:148mm !important;
      margin:0 !important;
      padding:0 !important;
      background:#fff !important;
      color:#000 !important;
    }

    body > *:not(#printInvoice){
      display:none !important;
    }

    #printInvoice{
      display:block !important;
      width:100% !important;
      margin:0 !important;
      padding:0 !important;
      background:#fff !important;
      color:#000 !important;
      /* Dùng đúng font giao diện và giữ fallback có sẵn trên Windows */
      font-family:"Be Vietnam Pro",Arial,"Segoe UI",Tahoma,sans-serif !important;
      font-synthesis:none !important;
      font-size:11px;
      line-height:1.35;
    }

    #printInvoice,#printInvoice *{box-sizing:border-box}

    .pdf-head{
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom:1.5px solid #1E7A46;
      padding-bottom:7px;
      margin-bottom:8px;
    }

    .pdf-logo{
      width:52px;
      height:52px;
      object-fit:contain;
      flex:0 0 52px;
    }

    .pdf-company{
      flex:1;
      min-width:0;
    }

    .pdf-company-name{
      font-size:14px;
      line-height:1.2;
      font-weight:800;
      color:#1E7A46;
    }

    .pdf-phone{
      margin-top:3px;
      font-size:9.5px;
      color:#444;
    }

    .pdf-bank{
      margin-top:2px;
      font-size:9px;
      line-height:1.25;
      color:#333;
      font-weight:600;
    }

    .pdf-qr-wrap{
      flex:0 0 25mm;
      width:25mm;
      text-align:center;
      align-self:flex-start;
    }

    .pdf-qr{
      display:block;
      width:25mm;
      height:25mm;
      object-fit:contain;
      margin:0 auto;
      background:#fff;
    }

    .pdf-qr-label{
      margin-top:2px;
      font-size:7.5px;
      line-height:1.15;
      font-weight:700;
      color:#333;
    }

    .pdf-title{
      text-align:center;
      font-size:15px;
      font-weight:800;
      margin:7px 0 9px;
    }

    .pdf-info{
      margin-bottom:8px;
      font-size:10.5px;
    }

    .pdf-info-row{margin:2px 0}

    .pdf-table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      margin-top:4px;
    }

    .pdf-table th{
      padding:5px 3px;
      border-top:1px solid #777;
      border-bottom:1px solid #777;
      font-size:9.5px;
      font-weight:800;
      text-align:left;
    }

    .pdf-table td{
      padding:5px 3px;
      border-bottom:1px dashed #ccc;
      vertical-align:top;
      font-size:9.5px;
    }

    .pdf-col-name{width:58%}
    .pdf-col-qty{
      width:12%;
      text-align:center !important;
    }
    .pdf-col-price{
      width:30%;
      text-align:right !important;
    }

    .pdf-product-name{
      font-weight:700;
      word-break:break-word;
    }

    .pdf-product-sub{
      margin-top:1px;
      color:#555;
      font-size:8.5px;
    }

    .pdf-summary{
      margin-top:9px;
      margin-left:auto;
      width:72%;
      font-size:10px;
    }

    .pdf-summary-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:2px 0;
    }

    .pdf-summary-row strong{white-space:nowrap}

    .pdf-total{
      font-size:12px;
      font-weight:800;
    }

    .pdf-remain{
      color:#B23B2E;
      font-size:12px;
      font-weight:800;
      border-top:1px solid #999;
      margin-top:3px;
      padding-top:4px;
    }

    .pdf-note{
      margin-top:9px;
      padding-top:6px;
      border-top:1px dashed #bbb;
      font-size:9.5px;
      font-style:italic;
    }

    .pdf-thanks{
      text-align:center;
      margin-top:15px;
      font-size:9px;
      color:#555;
      font-weight:700;
    }

    .pdf-table tr,
    .pdf-summary,
    .pdf-note,
    .pdf-thanks{
      break-inside:avoid;
      page-break-inside:avoid;
    }
  }

</style>
</head>
<body data-che-do="tm">

<header>
  <div class="hd-top">
    <div class="brand">Đức Thành<small>Tra giá &amp; tính đơn</small></div>
    <div class="toggle" role="group" aria-label="Chế độ giá">
      <button id="btn-tm" class="on" onclick="datCheDo('tm')">Tiền mặt</button>
      <button id="btn-no" onclick="datCheDo('no')">Nợ</button>
    </div>
  </div>
  <div class="search-wrap">
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Gõ tên hàng… (vd: dau trau, ure, kali)" oninput="loc()">
    <button class="clear-q" id="clearq" onclick="xoaTim()" aria-label="Xoá">×</button>
  </div>
  <div class="filters">
    <button class="chip on" id="chip-all" onclick="setNhom('all')">Tất cả</button>
    <button class="chip" id="chip-pb" onclick="setNhom('Phân bón')">Phân bón</button>
    <button class="chip" id="chip-bvtv" onclick="setNhom('Thuốc BVTV')">Thuốc BVTV</button>
  </div>
  <div class="statusbar">
    <span id="status">Đang tải bảng giá…</span>
    <button class="refresh" onclick="taiGia(true)">↻ Cập nhật giá</button>
  </div>
</header>

<main id="list"></main>

<div class="bar">
  <div class="bar-in">
    <div class="bar-tot">
      <div class="lbl">Tổng đơn</div>
      <div class="sum" id="barSum">0 <span class="cur">đ</span></div>
      <button class="new-order" onclick="yeuCauDonMoi()">＋ Đơn mới</button>
    </div>
    <button class="btn-view" id="btnView" onclick="moDon()" disabled>Xem đơn<span class="cnt" id="barCnt">0</span></button>
  </div>
</div>

<div class="scrim" id="scrim" onclick="dongDon()"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Đơn hàng" aria-modal="true" aria-hidden="true" inert>
  <div class="sheet-hd">
    <h2>Đơn hàng</h2>
    <button class="jump-pay" onclick="xemThanhToan()">Thanh toán ↓</button>
    <button class="x" onclick="dongDon()" aria-label="Đóng">×</button>
  </div>
  <div class="sheet-scroll">
    <details class="customer-info" id="customerInfo">
    <summary>Thông tin khách hàng / ngày / ghi chú</summary>
    <div class="don-info">
      <label>Ngày giờ<input type="datetime-local" id="fNgay" onchange="luuField()"></label>
      <label>Tên khách hàng<input type="text" id="fKhach" placeholder="Nhập tên khách (nếu cần)" oninput="luuField()"></label>
      <label>Ghi chú<input type="text" id="fGhiChu" placeholder="vd: giao chiều nay, nợ tới mùa…" oninput="luuField()"></label>
    </div>
    </details>
    <div id="sheetBody"></div>
    <div class="sheet-summary" id="paymentSummary">
    <div class="grand">
      <span class="lbl">Tổng cộng</span>
      <span class="val" id="grandVal">0 <span class="cur">đ</span></span>
    </div>
    <div class="pay-row">
      <label for="fGiam">Giảm giá</label>

/* ---------- Tải bảng giá ---------- */
async function taiGia(force){
  // Giữ nguyên bảng giá và mã mặt hàng trong suốt một đơn đang nhập.
  if(soMon()>0){ if(force) toast('Tạo đơn mới trước khi cập nhật bảng giá'); return; }
  setStatus('Đang tải bảng giá…');
  let items = null;
  for(let i=0;i<SOURCES.length;i++){
    try{
      const base = SOURCES[i];
      const url = base + (base.indexOf('?')>=0?'&':'?') + '_=' + Date.now();
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const parsed = parseCSV(text);
      if(parsed.length){ items = parsed; break; }
    }catch(e){ /* thử nguồn kế tiếp */ }
  }
  if(soMon()>0){ setStatus('Đang nhập đơn · giữ bảng giá hiện tại'); return; }
  if(items){
    HANG = items;
    const now = new Date();
    try{ localStorage.setItem('dt_data', JSON.stringify({items, at: now.toISOString()})); }catch(e){}
    setStatus('Cập nhật lúc ' + gioPhut(now) + ' · ' + HANG.length + ' mặt hàng');
    loc(); veBar(); veDon();
    if(force) toast('Đã cập nhật giá mới');
  }else{
    const cached = layCache();
    if(cached){
      HANG = cached.items;
      setStatus('⚠ Chưa tải được — dùng giá lưu lúc ' + gioPhut(new Date(cached.at)));
      loc(); veBar(); veDon();
    }else{
      setStatus('⚠ Không tải được bảng giá. Cần mạng cho lần đầu, rồi bấm “↻ Cập nhật giá”.');
      document.getElementById('list').innerHTML='<div class="empty">Chưa có dữ liệu. Cần mạng để tải lần đầu.</div>';
    }
  }
}
function layCache(){ try{ return JSON.parse(localStorage.getItem('dt_data')||'null'); }catch(e){ return null; } }
function setStatus(t){ document.getElementById('status').textContent = t; }
function gioPhut(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }

/* ---------- Phân tích CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  const out=[]; let seq=0;
  for(let r=1;r<rows.length;r++){
    const a=rows[r]; if(!a || a.every(x=>!x || !x.trim())) continue;
    const nhom=(a[0]||'').trim(), ten=(a[1]||'').trim();
    if(!ten) continue;
    seq++;
    out.push({
      id:(nhom.startsWith('Phân')?'p':'t')+seq,
      nhom, ten,
      chiso:(a[2]||'').trim(), dvt:(a[3]||'').trim(),
      tm:soTien(a[4]), no:soTien(a[5]),
    });
  }
  return out;
}
function soTien(s){ s=(s||'').replace(/[^\d]/g,''); return s?parseInt(s,10):0; }

/* ---------- Tiện ích ---------- */
function boDau(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
function tien(n){ return (n||0).toLocaleString('vi-VN'); }
function padPhai(t,w){ t=String(t); while(t.length<w) t+=' '; return t; }
function padTrai(t,w){ t=String(t); while(t.length<w) t=' '+t; return t; }
function tenHang(h){ return h.ten + ((h.chiso && boDau(h.ten).indexOf(boDau(h.chiso))<0) ? ' '+h.chiso : ''); }
function giaCua(h){ if(cheDo==='no') return (h.no&&h.no>0)?h.no:h.tm; return h.tm; }
function nowLocal(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function ngayDep(v){ if(!v) return ''; const [d,t]=v.split('T'); if(!t) return v; const [y,mo,da]=d.split('-'); return da+'/'+mo+'/'+y+' '+t; }
function luuField(){ ngay=document.getElementById('fNgay').value; khach=document.getElementById('fKhach').value; ghichu=document.getElementById('fGhiChu').value; luu(); }
function nhapTra(){ const el=document.getElementById('fTra'); const raw=el.value.replace(/[^\d]/g,''); tra=raw?parseInt(raw,10):0; el.value=raw?tra.toLocaleString('vi-VN'):''; luu(); capNhatConLai(); }
function nhapGiam(){ const el=document.getElementById('fGiam'); const raw=el.value.replace(/[^\d]/g,''); giam=raw?parseInt(raw,10):0; el.value=raw?giam.toLocaleString('vi-VN'):''; luu(); capNhatConLai(); }
function thanhTien(){ return Math.max(0, tongTien()-giam); }
function traDu(){ tra=thanhTien(); document.getElementById('fTra').value=tra?tra.toLocaleString('vi-VN'):''; luu(); capNhatConLai(); }
function capNhatConLai(){

}
function dienFields(){ if(!ngay) ngay=nowLocal(); document.getElementById('fNgay').value=ngay; document.getElementById('fKhach').value=khach||''; document.getElementById('fGhiChu').value=ghichu||''; document.getElementById('fTra').value=tra?tra.toLocaleString('vi-VN'):''; document.getElementById('fGiam').value=giam?giam.toLocaleString('vi-VN'):''; capNhatConLai(); }

/* ---------- Danh sách & Lọc ---------- */
function veDong(h) {
  const q=gio[h.id]||0;
  const dieuKhien = q>0
    ? '<div class="stepper"><button onclick="them(\''+h.id+'\',-1)" aria-label="Bớt">−</button><input class="qtyin" inputmode="numeric" value="'+q+'" onfocus="this.select()" oninput="datSL(\''+h.id+'\',this.value)"><button onclick="them(\''+h.id+'\',1)" aria-label="Thêm">+</button></div>'

    +'<div class="price">'+tien(giaCua(h))+' <span class="cur">đ</span></div></div>'
    +'<div class="add-col">'+dieuKhien+'</div></div>';
}

function loc(){
  const kw=boDau(document.getElementById('q').value.trim());
  document.getElementById('clearq').classList.toggle('show',kw.length>0);
  if(!HANG.length){ return; }
  const dsLoc=HANG.filter(h=>{
    if(nhomLoc!=='all' && h.nhom!==nhomLoc) return false;
    if(!kw) return true;
    const hay=boDau(h.ten+' '+h.chiso+' '+h.dvt);
    return kw.split(/\s+/).every(t=>hay.includes(t));
  });
  const list=document.getElementById('list');
  if(dsLoc.length===0){ list.innerHTML='<div class="empty">Không tìm thấy hàng nào.<br>Thử gõ ngắn hơn, ví dụ “dau trau”.</div>'; return; }
  
  let html='';
  if (!kw) {
    const hayBan = [...dsLoc].filter(h => luotBan[h.id] > 0).sort((a,b) => luotBan[b.id] - luotBan[a.id]).slice(0, 5);
    if(hayBan.length > 0) {
      html += '<div class="group-h">⭐ Hay bán nhất</div>';
      hayBan.forEach(h => html += veDong(h));
    }
  }

  let nhomHienTai='';
  dsLoc.forEach(h=>{
    if(h.nhom!==nhomHienTai){ nhomHienTai=h.nhom; html+='<div class="group-h">'+h.nhom+'</div>'; }
    html += veDong(h);
  });
  list.innerHTML=html;
}

}
function datSL(id,val){
  const n=parseInt((val||'').replace(/[^\d]/g,''))||0;
  if(n<=0) delete gio[id]; else gio[id]=n;
  luu(); veBar();
  // Cập nhật số tiền tại chỗ để bàn phím và nút +/- không bị thay DOM khi nhập.
  const h=HANG.find(x=>x.id===id);
  document.querySelectorAll('[data-product="'+id+'"]').forEach(row=>{
    const input=row.querySelector('.qtyin');
    if(input && input!==document.activeElement) input.value=n;
    const sub=row.querySelector('.line-sub'),total=row.querySelector('.line-total');
    if(h && sub) sub.textContent=tien(giaCua(h))+' đ × '+n+' '+h.dvt;
    if(h && total) total.textContent=tien(giaCua(h)*n)+' đ';
  });

  capNhatConLai();
}

/* ---------- Giỏ ---------- */
function them(id,d){ 
  const q=(gio[id]||0)+d; 
  if(q<=0) delete gio[id]; else gio[id]=q; 
  if(d>0) luotBan[id] = (luotBan[id] || 0) + 1; 
  luu(); loc(); veBar(); veDon(); 
}
function tongTien(){ let t=0; for(const id in gio){ const h=HANG.find(x=>x.id===id); if(h) t+=giaCua(h)*gio[id]; } return t; }
function soMon(){ return Object.keys(gio).filter(id=>HANG.find(x=>x.id===id)).length; }
function veBar(){ document.getElementById('barSum').innerHTML=tien(tongTien())+' <span class="cur">đ</span>'; const n=soMon(); document.getElementById('barCnt').textContent=n; document.getElementById('btnView').disabled=n===0; }

  const body=document.getElementById('sheetBody'); const ids=Object.keys(gio).filter(id=>HANG.find(x=>x.id===id));
  if(ids.length===0){ body.innerHTML='<div class="empty">Chưa có món nào.<br>Bấm dấu + ở danh sách để thêm.</div>'; }
  else{
    let html='';
    ids.forEach(id=>{ const h=HANG.find(x=>x.id===id); if(!h) return; const g=giaCua(h),q=gio[id];

        +'<button class="del" onclick="xoaMon(\''+id+'\')">Xoá</button></div>'
        +'<div class="line-bot"><div class="stepper"><button onclick="them(\''+id+'\',-1)">−</button><input class="qtyin" inputmode="numeric" value="'+q+'" onfocus="this.select()" oninput="datSL(\''+id+'\',this.value)"><button onclick="them(\''+id+'\',1)">+</button></div>'
        +'<div class="line-total">'+tien(g*q)+' đ</div></div></div>';
    });
    body.innerHTML=html;
  }
  document.getElementById('grandVal').innerHTML=tien(tongTien())+' <span class="cur">đ</span>';
  capNhatConLai();
}

    .replace(/[-T:]/g, '')

  let summary = `
    <div class="pdf-summary-row">

      <strong>${tien(tong)} đ</strong>
    </div>
  `;

    summary += `

      <div class="pdf-summary-row pdf-total">
        <span>Thành tiền</span>
        <strong>${tien(tt)} đ</strong>
      </div>

    summary += `
      <div class="pdf-summary-row">
        <span>Khách đã trả</span>

    <div class="pdf-summary-row pdf-remain">

      <img class="pdf-logo" src="logo.png" alt="">

        <div class="pdf-company-name">
          ${escapeHTML(CUA_HANG)}
        </div>
        <div class="pdf-phone">
          ${escapeHTML(DIEN_THOAI)}
        </div>
        <div class="pdf-bank">
          ${escapeHTML(NGAN_HANG)} · STK: ${escapeHTML(SO_TAI_KHOAN)}<br>
          ${escapeHTML(TEN_TAI_KHOAN)}
        </div>
      </div>
      <div class="pdf-qr-wrap">
        <img id="pdfQr" class="pdf-qr" src="" alt="QR thanh toán">
        <div class="pdf-qr-label">QUÉT QR THANH TOÁN</div>
      </div>
    </div>

    <div class="pdf-title">HÓA ĐƠN BÁN HÀNG</div>

    <div class="pdf-info">
      <div class="pdf-info-row">
        <strong>Ngày:</strong>
        ${escapeHTML(ngayDep(thoiGian))}
      </div>

      ${
        khach
          ? `
            <div class="pdf-info-row">
              <strong>Khách hàng:</strong>
              ${escapeHTML(khach)}
            </div>
          `
          : ''
      }
    </div>

    <table class="pdf-table">
      <thead>
        <tr>
          <th class="pdf-col-name">Tên hàng</th>
          <th class="pdf-col-qty">SL</th>
          <th class="pdf-col-price">Thành tiền</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>

    <div class="pdf-summary">
      ${summary}
    </div>

    ${
      ghichu
        ? `
          <div class="pdf-note">
            <strong>Ghi chú:</strong>
            ${escapeHTML(ghichu)}
          </div>
        `
        : ''
    }

    <div class="pdf-thanks">Cảm ơn Quý khách!</div>
  `;

  /*
   * Tạo VietQR động theo số tiền còn phải thanh toán.
   * VietQR Quick Link hỗ trợ BANK_ID/BIN, số tài khoản, amount,
   * addInfo và accountName.
   */
  const qrAmount = conLai > 0 ? Math.round(conLai) : Math.round(tt);
  const qrInfoBase = 'DUC THANH ' + safeDate.slice(0, 14);
  const qrInfo = qrInfoBase.replace(/[^A-Za-z0-9 ]/g, '').slice(0, 25);
  const qrUrl =
    'https://img.vietqr.io/image/' +
    encodeURIComponent(VIETQR_BANK_BIN) + '-' +
    encodeURIComponent(SO_TAI_KHOAN) + '-qr_only.png' +
    '?amount=' + encodeURIComponent(qrAmount) +
    '&addInfo=' + encodeURIComponent(qrInfo) +
    '&accountName=' + encodeURIComponent(TEN_TK_VIETQR);

  const qrImg = document.getElementById('pdfQr');
  if (qrImg) {
    qrImg.src = qrUrl;
  }

  const oldText = btn ? btn.innerText : '';

  if (btn) {
    btn.innerText = 'Đang chuẩn bị...';
    btn.disabled = true;
  }

  let restored = false;
  let printStarted = false;

  const restore = () => {
    if (restored) return;
    restored = true;
    dangXuatDon = false;

    document.title = oldTitle;
    invoice.innerHTML = '';

    if (btn) {
      btn.innerText = oldText;
      btn.disabled = false;
    }

    window.removeEventListener('afterprint', restore);
    document.removeEventListener('visibilitychange', onVisibilityBack);
  };

  window.addEventListener('afterprint', restore, { once: true });

  const onVisibilityBack = () => {
    if (printStarted && document.visibilityState === 'visible') {
      restore();
    }
  };
  document.addEventListener('visibilitychange', onVisibilityBack);

  // Chờ font Be Vietnam Pro tải xong trước khi chụp nội dung để in PDF.
  // Nếu Google Fonts không tải được, trình duyệt vẫn dùng Arial/Segoe UI/Tahoma.
  const waitForPrintFonts = async () => {
    if (!document.fonts) return;
    try {
      await document.fonts.ready;
      await Promise.all([
        document.fonts.load('400 11px "Be Vietnam Pro"'),
        document.fonts.load('700 11px "Be Vietnam Pro"'),
        document.fonts.load('800 14px "Be Vietnam Pro"')
      ]);
    } catch (e) {
      // Font dự phòng sẽ được dùng nếu font web không khả dụng.
    }
  };

  const waitForQr = () => new Promise(resolve => {
    const img = document.getElementById('pdfQr');
    if (!img || !img.src) return resolve();
    if (img.complete && img.naturalWidth > 0) return resolve();
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      img.removeEventListener('load', finish);
      img.removeEventListener('error', finish);
      resolve();
    };
    img.addEventListener('load', finish, { once: true });
    img.addEventListener('error', finish, { once: true });
    setTimeout(finish, 5000);
  });

  requestAnimationFrame(() => {
    requestAnimationFrame(async () => {
      await waitForPrintFonts();
      await waitForQr();
      if (btn) btn.innerText = 'Đang mở...';
      printStarted = true;
      window.print();
    });
  });
}

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* ---------- Xuất đơn dạng Text ---------- */
function donText(){
  let s=CUA_HANG+'\n'+DIEN_THOAI+'\n━━━━━━━━━━\n';
  if(ngay) s+='Ngày: '+ngayDep(ngay)+'\n';
  if(khach) s+='Khách: '+khach+'\n';
  s+='\n';
  const items=[];
  for(const id in gio){ const h=HANG.find(x=>x.id===id); if(!h) continue; const g=giaCua(h),qc=gio[id];
    items.push({ten:tenHang(h), left:tien(g)+' × '+qc+' '+h.dvt+' = ', tot:tien(g*qc)+' đ'}); }
  const leftW=items.length?Math.max.apply(null,items.map(i=>i.left.length)):0;
  const totW =items.length?Math.max.apply(null,items.map(i=>i.tot.length)):0;
  let stt=0;
  items.forEach(i=>{ stt++; s+=stt+'. '+i.ten+'\n   '+padPhai(i.left,leftW)+padTrai(i.tot,totW)+'\n'; });
  const tong=tongTien(), tt=thanhTien();
  s+='━━━━━━━━━━\n';
  s+='Số món: '+items.length+'\n';
  const rows=[['Tổng cộng', tien(tong)+' đ']];
  if(giam>0){ rows.push(['Giảm giá', tien(giam)+' đ']); rows.push(['Thành tiền', tien(tt)+' đ']); }
  if(tra>0) rows.push(['Đã trả', tien(tra)+' đ']);
  rows.push(['► CÒN LẠI', (tra>=tt)?'0 đ (đã đủ)':tien(tt-tra)+' đ']);
  const lw=Math.max.apply(null,rows.map(r=>r[0].length));
  const nw=Math.max.apply(null,rows.map(r=>r[1].length));
  rows.forEach(r=> s+= padPhai(r[0],lw)+'  '+padTrai(r[1],nw)+'\n');
  if(ghichu) s+='Ghi chú: '+ghichu+'\n';
  s+='━━━━━━━━━━\nCảm ơn quý khách!';
  return s;
}
async function guiDon(){
  const txt=donText();
  if(navigator.share){
    dangXuatDon=true;
    try{ await navigator.share({text:txt}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
    finally{ dangXuatDon=false; boQuaLanQuayLai=true; hetHanBoQua=Date.now()+1500; }
  }
  try{ await navigator.clipboard.writeText(txt); toast('Máy không có nút chia sẻ — đã sao chép, mở Zalo dán vào'); }catch(e){ toast('Không gửi được'); }
}
async function saoChep(){
  try{ await navigator.clipboard.writeText(donText()); toast('Đã chép text đơn'); }
  catch(e){ toast('Không sao chép được'); }
}
let toTimer; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toTimer); toTimer=setTimeout(()=>t.classList.remove('show'),1800); }
function xoaTim(){ document.getElementById('q').value=''; loc(); document.getElementById('q').focus(); }

document.body.setAttribute('data-che-do',cheDo);
document.getElementById('btn-tm').classList.toggle('on',cheDo==='tm');
document.getElementById('btn-no').classList.toggle('on',cheDo==='no');
document.getElementById('customerInfo').open=window.matchMedia('(min-width:601px)').matches;
(function(){ const c=layCache(); if(c&&c.items&&c.items.length){ HANG=c.items; setStatus('Giá lưu lúc '+gioPhut(new Date(c.at))+' · đang cập nhật…'); } })();
setNhom(nhomLoc);
loc(); veBar(); veDon(); dienFields();
taiGia(false);

let lanTaiCuoi = Date.now();
function tuLamMoi(){ if(Date.now()-lanTaiCuoi > 15000){ lanTaiCuoi=Date.now(); taiGia(false); } }
document.addEventListener('visibilitychange', function(){ if(!document.hidden) tuLamMoi(); });
window.addEventListener('focus', tuLamMoi);
const _taiGiaGoc = taiGia;
taiGia = async function(f){ lanTaiCuoi = Date.now(); return _taiGiaGoc(f); };

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'})
      .then(reg => reg.update().catch(() => {}))
