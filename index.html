<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đức Thành — Tra giá &amp; tính đơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F8F5; --card:#FFFFFF; --ink:#16231C; --muted:#5C6B60; --line:#DCE3DA;
    --green:#1E7A46; --green-dark:#155C34; --green-soft:#E7F1EA;
    --ochre:#B9591A; --ochre-soft:#FBEDE0; --danger:#B23B2E;
    --shadow:0 2px 10px rgba(20,40,28,.08);
    --mode:var(--green); --mode-soft:var(--green-soft);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{max-width:640px;margin:0 auto;padding-bottom:120px;line-height:1.35}
  body[data-che-do="no"]{ --mode:var(--ochre); --mode-soft:var(--ochre-soft); }

  header{position:sticky;top:0;z-index:30;background:var(--paper);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:22px;letter-spacing:-.3px}
  .brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .toggle{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
  .toggle button{font-family:inherit;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;padding:9px 14px;border-radius:999px;cursor:pointer}
  .toggle button.on{color:#fff;background:var(--mode)}
  .search-wrap{position:relative;margin-top:10px}
  #q{width:100%;font-family:inherit;font-size:20px;font-weight:600;padding:16px 46px 16px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  #q:focus{outline:none;border-color:var(--mode)}
  #q::placeholder{color:var(--muted);font-weight:500}
  .clear-q{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:none}
  .clear-q.show{display:block}
  .statusbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
  .refresh{border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .refresh:active{transform:scale(.96)}

  main{padding:6px 12px 0}
  .group-h{font-size:13px;font-weight:700;color:var(--muted);padding:16px 6px 6px}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .row .info{flex:1;min-width:0}
  .name{font-size:19px;font-weight:700;line-height:1.25}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
  .badge{font-size:13px;font-weight:700;color:var(--green-dark);background:var(--green-soft);padding:2px 8px;border-radius:6px}
  body[data-che-do="no"] .badge{color:var(--ochre);background:var(--ochre-soft)}
  .unit{font-size:13px;color:var(--muted)}
  .price{font-size:20px;font-weight:800;margin-top:6px}
  .price .cur{font-size:14px;font-weight:600;color:var(--muted)}
  .add-col{display:flex;flex-direction:column;align-items:center;gap:2px}
  .add{border:0;background:var(--mode);color:#fff;font-family:inherit;font-weight:800;font-size:26px;width:52px;height:52px;border-radius:14px;cursor:pointer;line-height:1}
  .add:active{transform:scale(.94)}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{border:2px solid var(--mode);background:var(--card);color:var(--mode);font-family:inherit;font-weight:800;font-size:22px;width:44px;height:44px;border-radius:12px;cursor:pointer;line-height:1}
  .stepper .qty{min-width:34px;text-align:center;font-size:22px;font-weight:800}
  .empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:16px}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:640px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(20,40,28,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar-in{display:flex;align-items:center;gap:12px}
  .bar-tot{flex:1}
  .bar-tot .lbl{font-size:13px;color:var(--muted);font-weight:600}
  .bar-tot .sum{font-size:30px;font-weight:800;line-height:1.05}
  .bar-tot .sum .cur{font-size:15px;color:var(--muted)}
  .btn-view{border:0;background:var(--mode);color:#fff;font-family:inherit;font-weight:800;font-size:17px;padding:15px 20px;border-radius:14px;cursor:pointer}
  .btn-view:disabled{opacity:.4}
  .cnt{background:#fff;color:var(--mode);border-radius:999px;font-size:13px;font-weight:800;padding:1px 8px;margin-left:6px}

  .scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:50;display:none}
  .scrim.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:640px;margin:0 auto;background:var(--paper);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .22s ease;max-height:88vh;display:flex;flex-direction:column}
  .sheet.open{transform:translateY(0)}
  .sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
  .sheet-hd h2{font-size:20px;font-weight:800}
  .sheet-hd .x{border:0;background:var(--line);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
  .sheet-scroll{overflow:auto;padding:4px 12px 8px}
  .don-info{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
  .don-info label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
  .don-info input{font-family:inherit;font-size:18px;font-weight:600;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  .don-info input:focus{outline:none;border-color:var(--mode)}
  .line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .line-top{display:flex;justify-content:space-between;gap:10px}
  .line-name{font-size:17px;font-weight:700}
  .line-sub{font-size:13px;color:var(--muted);margin-top:2px}
  .line-bot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .line-total{font-size:19px;font-weight:800}
  .del{border:0;background:transparent;color:var(--danger);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:6px}
  .sheet-foot{border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card)}
  .grand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .grand .lbl{font-size:16px;font-weight:700}
  .grand .val{font-size:34px;font-weight:800}
  .grand .val .cur{font-size:16px;color:var(--muted)}
  .pay-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
  .pay-row label{font-size:16px;font-weight:700}
  .pay-row .money{position:relative}
  .pay-row input{font-family:inherit;font-size:20px;font-weight:800;text-align:right;width:170px;padding:11px 30px 11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  .pay-row input:focus{outline:none;border-color:var(--mode)}
  .pay-row .money::after{content:'đ';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;font-size:14px}
  .grand.remain .val{color:var(--ochre)}
  .grand.remain.done .val{color:var(--green);font-size:22px}
  .foot-btns{display:flex;gap:10px}
  .foot-btns button{flex:1;font-family:inherit;font-weight:800;font-size:16px;padding:15px;border-radius:14px;cursor:pointer;border:0}
  .b-clear{background:var(--card);border:2px solid var(--line)!important;color:var(--muted)}
  .b-copy{background:var(--mode);color:#fff}
  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-che-do="tm">

<header>
  <div class="hd-top">
    <div class="brand">Đức Thành<small>Tra giá &amp; tính đơn</small></div>
    <div class="toggle" role="group" aria-label="Chế độ giá">
      <button id="btn-tm" class="on" onclick="datCheDo('tm')">Tiền mặt</button>
      <button id="btn-no" onclick="datCheDo('no')">Nợ</button>
    </div>
  </div>
  <div class="search-wrap">
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Gõ tên hàng… (vd: dau trau, ure, kali)" oninput="loc()">
    <button class="clear-q" id="clearq" onclick="xoaTim()" aria-label="Xoá">×</button>
  </div>
  <div class="statusbar">
    <span id="status">Đang tải bảng giá…</span>
    <button class="refresh" onclick="taiGia(true)">↻ Cập nhật giá</button>
  </div>
</header>

<main id="list"></main>

<div class="bar">
  <div class="bar-in">
    <div class="bar-tot">
      <div class="lbl">Tổng đơn</div>
      <div class="sum" id="barSum">0 <span class="cur">đ</span></div>
    </div>
    <button class="btn-view" id="btnView" onclick="moDon()" disabled>Xem đơn<span class="cnt" id="barCnt">0</span></button>
  </div>
</div>

<div class="scrim" id="scrim" onclick="dongDon()"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Đơn hàng">
  <div class="sheet-hd">
    <h2>Đơn hàng</h2>
    <button class="x" onclick="dongDon()" aria-label="Đóng">×</button>
  </div>
  <div class="sheet-scroll">
    <div class="don-info">
      <label>Ngày giờ<input type="datetime-local" id="fNgay" onchange="luuField()"></label>
      <label>Tên khách hàng<input type="text" id="fKhach" placeholder="Nhập tên khách (nếu cần)" oninput="luuField()"></label>
    </div>
    <div id="sheetBody"></div>
  </div>
  <div class="sheet-foot">
    <div class="grand">
      <span class="lbl">Tổng cộng</span>
      <span class="val" id="grandVal">0 <span class="cur">đ</span></span>
    </div>
    <div class="pay-row">
      <label for="fTra">Khách đã trả</label>
      <span class="money"><input id="fTra" type="text" inputmode="numeric" placeholder="0" oninput="nhapTra()"></span>
    </div>
    <div class="grand remain" id="remainRow">
      <span class="lbl">Còn lại</span>
      <span class="val" id="remainVal">0 <span class="cur">đ</span></span>
    </div>
    <div class="foot-btns">
      <button class="b-clear" onclick="xoaDon()">Xoá đơn</button>
      <button class="b-copy" onclick="chiaSe()">Gửi / Sao chép</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== NGUỒN DỮ LIỆU: Google Sheet đã xuất bản (CSV) ====== */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTE1daL-gPDPB7j2JBBiuSsjiK4Ic0ui7ur3OUQtJxY0uEKJ6mgHHKRsdcP_5U7Q00rTL238UGoWNts/pub?output=csv';

let HANG = [];
let cheDo = 'tm';
let gio = {};
let khach = '', tra = 0, ngay = '';

try{
  const s = JSON.parse(localStorage.getItem('dt_state')||'{}');
  if(s.cheDo) cheDo = s.cheDo;
  if(s.gio) gio = s.gio;
  if(s.khach) khach = s.khach;
  if(s.tra) tra = s.tra;
  if(s.ngay) ngay = s.ngay;
}catch(e){}
function luu(){ try{ localStorage.setItem('dt_state', JSON.stringify({cheDo,gio,khach,tra,ngay})); }catch(e){} }

/* ---------- Tải bảng giá ---------- */
async function taiGia(force){
  setStatus('Đang tải bảng giá…');
  try{
    const url = CSV_URL + '&_=' + Date.now();
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const items = parseCSV(text);
    if(!items.length) throw new Error('trống');
    HANG = items;
    const now = new Date();
    try{ localStorage.setItem('dt_data', JSON.stringify({items, at: now.toISOString()})); }catch(e){}
    setStatus('Cập nhật lúc ' + gioPhut(now) + ' · ' + HANG.length + ' mặt hàng');
    loc(); veBar(); veDon();
    if(force) toast('Đã cập nhật giá mới');
  }catch(err){
    const cached = layCache();
    if(cached){
      HANG = cached.items;
      setStatus('⚠ Chưa tải được — dùng giá lưu lúc ' + gioPhut(new Date(cached.at)));
      loc(); veBar(); veDon();
    }else{
      setStatus('⚠ Không tải được bảng giá. Cần mạng cho lần đầu, rồi bấm “↻ Cập nhật giá”.');
      document.getElementById('list').innerHTML='<div class="empty">Chưa có dữ liệu. Cần mạng để tải lần đầu.</div>';
    }
  }
}
function layCache(){ try{ return JSON.parse(localStorage.getItem('dt_data')||'null'); }catch(e){ return null; } }
function setStatus(t){ document.getElementById('status').textContent = t; }
function gioPhut(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }

/* ---------- Phân tích CSV (hỗ trợ ô có dấu phẩy trong ngoặc kép) ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  const out=[]; let seq=0;
  for(let r=1;r<rows.length;r++){
    const a=rows[r]; if(!a || a.every(x=>!x || !x.trim())) continue;
    const nhom=(a[0]||'').trim(), ten=(a[1]||'').trim();
    if(!ten) continue;
    seq++;
    out.push({
      id:(nhom.startsWith('Phân')?'p':'t')+seq,
      nhom, ten,
      chiso:(a[2]||'').trim(), dvt:(a[3]||'').trim(),
      tm:soTien(a[4]), no:soTien(a[5]),
    });
  }
  return out;
}
function soTien(s){ s=(s||'').replace(/[^\d]/g,''); return s?parseInt(s,10):0; }

/* ---------- Tiện ích ---------- */
function boDau(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
function tien(n){ return (n||0).toLocaleString('vi-VN'); }
function giaCua(h){ if(cheDo==='no') return (h.no&&h.no>0)?h.no:h.tm; return h.tm; }
function nowLocal(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function ngayDep(v){ if(!v) return ''; const [d,t]=v.split('T'); if(!t) return v; const [y,mo,da]=d.split('-'); return da+'/'+mo+'/'+y+' '+t; }
function luuField(){ ngay=document.getElementById('fNgay').value; khach=document.getElementById('fKhach').value; luu(); }
function nhapTra(){ const el=document.getElementById('fTra'); const raw=el.value.replace(/[^\d]/g,''); tra=raw?parseInt(raw,10):0; el.value=raw?tra.toLocaleString('vi-VN'):''; luu(); capNhatConLai(); }
function capNhatConLai(){ const tong=tongTien(),row=document.getElementById('remainRow'),val=document.getElementById('remainVal'); if(tong>0&&tra>=tong){row.classList.add('done');val.innerHTML='Đã đủ';}else{row.classList.remove('done');val.innerHTML=tien(tong-tra)+' <span class="cur">đ</span>';} }
function dienFields(){ if(!ngay) ngay=nowLocal(); document.getElementById('fNgay').value=ngay; document.getElementById('fKhach').value=khach||''; document.getElementById('fTra').value=tra?tra.toLocaleString('vi-VN'):''; capNhatConLai(); }

/* ---------- Chế độ giá ---------- */
function datCheDo(m){
  cheDo=m; document.body.setAttribute('data-che-do',m);
  document.getElementById('btn-tm').classList.toggle('on',m==='tm');
  document.getElementById('btn-no').classList.toggle('on',m==='no');
  luu(); loc(); veDon(); veBar();
}

/* ---------- Danh sách ---------- */
function loc(){
  const kw=boDau(document.getElementById('q').value.trim());
  document.getElementById('clearq').classList.toggle('show',kw.length>0);
  if(!HANG.length){ return; }
  const dsLoc=HANG.filter(h=>{ if(!kw) return true; const hay=boDau(h.ten+' '+h.chiso+' '+h.dvt); return kw.split(/\s+/).every(t=>hay.includes(t)); });
  const list=document.getElementById('list');
  if(dsLoc.length===0){ list.innerHTML='<div class="empty">Không tìm thấy hàng nào.<br>Thử gõ ngắn hơn, ví dụ “dau trau”.</div>'; return; }
  let html='',nhomHienTai='';
  dsLoc.forEach(h=>{
    if(h.nhom!==nhomHienTai){ nhomHienTai=h.nhom; html+='<div class="group-h">'+h.nhom+'</div>'; }
    const q=gio[h.id]||0;
    const dieuKhien = q>0
      ? '<div class="stepper"><button onclick="them(\''+h.id+'\',-1)" aria-label="Bớt">−</button><span class="qty">'+q+'</span><button onclick="them(\''+h.id+'\',1)" aria-label="Thêm">+</button></div>'
      : '<button class="add" onclick="them(\''+h.id+'\',1)" aria-label="Thêm">+</button>';
    html+='<div class="row"><div class="info"><div class="name">'+h.ten+'</div>'
      +'<div class="meta">'+(h.chiso?'<span class="badge">'+h.chiso+'</span>':'')+'<span class="unit">'+h.dvt+'</span></div>'
      +'<div class="price">'+tien(giaCua(h))+' <span class="cur">đ</span></div></div>'
      +'<div class="add-col">'+dieuKhien+'</div></div>';
  });
  list.innerHTML=html;
}

/* ---------- Giỏ ---------- */
function them(id,d){ const q=(gio[id]||0)+d; if(q<=0) delete gio[id]; else gio[id]=q; luu(); loc(); veBar(); veDon(); }
function tongTien(){ let t=0; for(const id in gio){ const h=HANG.find(x=>x.id===id); if(h) t+=giaCua(h)*gio[id]; } return t; }
function soMon(){ return Object.keys(gio).filter(id=>HANG.find(x=>x.id===id)).length; }
function veBar(){ document.getElementById('barSum').innerHTML=tien(tongTien())+' <span class="cur">đ</span>'; const n=soMon(); document.getElementById('barCnt').textContent=n; document.getElementById('btnView').disabled=n===0; }
function veDon(){
  const body=document.getElementById('sheetBody'); const ids=Object.keys(gio).filter(id=>HANG.find(x=>x.id===id));
  if(ids.length===0){ body.innerHTML='<div class="empty">Chưa có món nào.<br>Bấm dấu + ở danh sách để thêm.</div>'; }
  else{
    let html='';
    ids.forEach(id=>{ const h=HANG.find(x=>x.id===id); if(!h) return; const g=giaCua(h),q=gio[id];
      html+='<div class="line"><div class="line-top"><div><div class="line-name">'+h.ten+(h.chiso?' '+h.chiso:'')+'</div>'
        +'<div class="line-sub">'+tien(g)+' đ × '+q+' '+h.dvt+'</div></div>'
        +'<button class="del" onclick="xoaMon(\''+id+'\')">Xoá</button></div>'
        +'<div class="line-bot"><div class="stepper"><button onclick="them(\''+id+'\',-1)">−</button><span class="qty">'+q+'</span><button onclick="them(\''+id+'\',1)">+</button></div>'
        +'<div class="line-total">'+tien(g*q)+' đ</div></div></div>';
    });
    body.innerHTML=html;
  }
  document.getElementById('grandVal').innerHTML=tien(tongTien())+' <span class="cur">đ</span>';
  capNhatConLai();
}
function xoaMon(id){ delete gio[id]; luu(); loc(); veBar(); veDon(); }

/* ---------- Sheet ---------- */
function moDon(){ if(soMon()===0) return; dienFields(); document.getElementById('scrim').classList.add('open'); document.getElementById('sheet').classList.add('open'); }
function dongDon(){ document.getElementById('scrim').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); }
function xoaDon(){ gio={}; khach=''; tra=0; ngay=nowLocal(); luu(); loc(); veBar(); veDon(); dienFields(); dongDon(); }

/* ---------- Xuất đơn ---------- */
function donText(){
  let s='ĐỨC THÀNH\n';
  if(ngay) s+='Ngày: '+ngayDep(ngay)+'\n';
  if(khach) s+='Khách: '+khach+'\n';
  s+='Giá: '+(cheDo==='no'?'nợ':'tiền mặt')+'\n———\n';
  let stt=0;
  for(const id in gio){ const h=HANG.find(x=>x.id===id); if(!h) continue; stt++; const g=giaCua(h);
    s+=stt+'. '+h.ten+(h.chiso?' '+h.chiso:'')+'  '+tien(g)+' × '+gio[id]+' = '+tien(g*gio[id])+' đ\n'; }
  const tong=tongTien(); s+='———\nTỔNG: '+tien(tong)+' đ';
  if(tra>0){ s+='\nĐã trả: '+tien(tra)+' đ'; s+='\nCòn lại: '+(tra>=tong?'0 đ (đã đủ)':tien(tong-tra)+' đ'); }
  return s;
}
async function chiaSe(){
  const txt=donText();
  if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(txt); toast('Đã sao chép đơn'); }catch(e){ toast('Không sao chép được'); }
}
let toTimer; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toTimer); toTimer=setTimeout(()=>t.classList.remove('show'),1800); }
function xoaTim(){ document.getElementById('q').value=''; loc(); document.getElementById('q').focus(); }

loc(); veBar(); veDon(); dienFields();
taiGia(false);
